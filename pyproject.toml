[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "trafficcast"
version = "0.1.0"
description = "Procese senzor SUMO și gateway MQTT pentru o intersecție simulată"
requires-python = ">=3.11"
dependencies = ["paho-mqtt==2.1.0", "traci==1.28.0", "sumolib==1.28.0"]

[project.optional-dependencies]
dev = ["pytest>=8,<10"]

[project.scripts]
trafficcast = "trafficcast.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
